version: '3.9'

services:
  # ===== Nginx Reverse Proxy =====
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks:
      - azmoonyar-net

  # ===== Frontend =====
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.azmoonai.ir
      - NEXT_PUBLIC_WS_URL=wss://api.azmoonai.ir
      - NEXT_PUBLIC_APP_URL=https://azmoonai.ir
    restart: unless-stopped
    networks:
      - azmoonyar-net

  # ===== Backend API =====
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://azmoonyar:${DB_PASSWORD}@postgres:5432/azmoonyar_prod
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=azmoonyar
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=15m
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=https://azmoonai.ir
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - APP_URL=https://api.azmoonai.ir
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - azmoonyar-net

  # ===== AI Service =====
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - API_URL=http://api:4000
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - azmoonyar-net

  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=azmoonyar_prod
      - POSTGRES_USER=azmoonyar
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U azmoonyar -d azmoonyar_prod']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - azmoonyar-net

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - azmoonyar-net

  # ===== MinIO =====
  minio:
    image: minio/minio:latest
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - azmoonyar-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  certbot_data:

networks:
  azmoonyar-net:
    driver: bridge
