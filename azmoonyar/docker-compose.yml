version: '3.9'

services:
  # ===== Frontend =====
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000
    depends_on:
      - api
    networks:
      - azmoonyar-net

  # ===== Backend API =====
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://azmoonyar:secret@postgres:5432/azmoonyar_dev
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=azmoonyar
      - JWT_SECRET=dev_jwt_secret_change_in_production
      - JWT_REFRESH_SECRET=dev_refresh_secret_change_in_production
      - AI_SERVICE_URL=http://ai-service:8000
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMS_PROVIDER=kaveneghar
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - azmoonyar-net

  # ===== AI Service =====
  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - ./apps/ai-service:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      - redis
      - minio
    networks:
      - azmoonyar-net

  # ===== PostgreSQL =====
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=azmoonyar_dev
      - POSTGRES_USER=azmoonyar
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U azmoonyar -d azmoonyar_dev']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - azmoonyar-net

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - azmoonyar-net

  # ===== MinIO (Object Storage) =====
  minio:
    image: minio/minio:latest
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    networks:
      - azmoonyar-net

  # ===== MinIO Setup (ایجاد bucket‌های اولیه) =====
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;

      mc mb local/azmoonyar --ignore-existing;
      mc mb local/azmoonyar-temp --ignore-existing;
      mc mb local/azmoonyar-certificates --ignore-existing;
      mc mb local/azmoonyar-avatars --ignore-existing;
      mc mb local/azmoonyar-exam-media --ignore-existing;

      mc anonymous set public local/azmoonyar/public;
      mc anonymous set public local/azmoonyar-avatars;
      mc anonymous set public local/azmoonyar-exam-media;

      echo 'MinIO setup complete — all buckets created';
      "
    networks:
      - azmoonyar-net

  # ===== Elasticsearch =====
  elasticsearch:
    image: elasticsearch:8.12.0
    ports:
      - '9200:9200'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:9200/_cluster/health | grep -q "green\|yellow"']
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - azmoonyar-net

  # ===== Elasticsearch Setup (mapping فارسی) =====
  es-setup:
    image: curlimages/curl:latest
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./scripts/init-elasticsearch.sh:/init-elasticsearch.sh
    entrypoint: >
      /bin/sh -c "
      ELASTICSEARCH_URL=http://elasticsearch:9200 sh /init-elasticsearch.sh
      "
    networks:
      - azmoonyar-net

  # ===== MailHog (تست ایمیل در development) =====
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - azmoonyar-net

  # ===== Redis Commander (مدیریت Redis) =====
  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - '8081:8081'
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - azmoonyar-net
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  minio_data:
  es_data:

networks:
  azmoonyar-net:
    driver: bridge
